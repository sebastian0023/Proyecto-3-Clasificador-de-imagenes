name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  web:
    name: Web tests + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Proyecto2/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Proyecto2/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  quality:
    name: Ruff + pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Proyecto2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -e ".[dev,pipeline]"

      # El build DEBE fallar si el lint o las pruebas fallan: sin `continue-on-error`.
      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (formato)
        run: ruff format --check .

      - name: pytest
        run: pytest

      # No corre `dvc repro` de verdad: necesitaria el dataset de 300+
      # imagenes y MinIO levantado, y el job `smoke` ya prueba que la
      # infraestructura arranca. Esto solo valida que `dvc.yaml` describe un
      # grafo bien formado (sin ciclos, sin una etapa que quedo sin conectar
      # por un typo en `deps`/`outs`) sin ejecutar ningun comando del pipeline.
      - name: dvc.yaml es un grafo valido
        run: dvc dag

  smoke:
    name: Arranque desde cero
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Proyecto2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Reproduce la compuerta M1 de la rubrica: un clon limpio tiene que
      # levantar app + MariaDB + MinIO con un solo comando, sin pasos extra.
      # `up.py` falla con codigo != 0 si /health no queda en OK.
      - name: python scripts/up.py
        run: python scripts/up.py

      - name: Logs de la app si algo fallo
        if: failure()
        run: docker compose logs

      - name: Apagar
        if: always()
        run: docker compose down -v

  terraform:
    name: Terraform Validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Proyecto2/terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"

      - name: Terraform Format Check
        run: terraform fmt -check

      - name: Terraform Init
        run: terraform init -backend=false

      - name: Terraform Validate
        run: terraform validate

  compuerta:
    name: La compuerta bloquea el build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Proyecto2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -e ".[dev]"

      # El dataset real vive en el remote de DVC y pesa 400 MB: traerlo aqui
      # seria lento y necesitaria credenciales. Para probar que la compuerta
      # BLOQUEA basta un dataset que no cumpla el minimo, y la fixture de F2
      # tiene 3 imagenes: falla `min_images_per_class` por definicion.
      - name: Preparar un dataset que no cumple el minimo
        run: |
          mkdir -p data/raw/images
          cp tests/fixtures/coco_valido.json data/raw/annotations.coco.json

      # Este paso es el que da sentido al Frente 4 en CI. Sin el, el `exit 1`
      # de la compuerta solo existe en la terminal de quien lo corre a mano.
      - name: La compuerta debe rechazar un dataset insuficiente
        run: |
          if dq gate; then
            echo "::error::La compuerta dejo pasar un dataset de 3 imagenes."
            exit 1
          fi
          echo "La compuerta bloqueo, como debe."

      - name: El reporte nombra la regla que fallo
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          reporte = json.loads(Path("reports/quality.json").read_text(encoding="utf-8"))
          bloquean = [
              check["name"]
              for check in reporte["checks"]
              if check["status"] == "fail" and check["severity"] == "error"
          ]
          assert reporte["status"] == "fail", reporte["status"]
          assert reporte["exit_code"] == 1, reporte["exit_code"]
          assert "min_images_per_class" in bloquean, bloquean
          print("Bloquean:", ", ".join(bloquean))
          PY

  promote:
    name: Publicar el dataset validado en PROD
    needs: [quality, web, terraform]
    if: github.repository == 'stephy0410/ruta-al-dataset-v1' && github.ref == 'refs/heads/dvc_fix'
    permissions:
      contents: write
      id-token: write
    uses: ./.github/workflows/promote-dataset.yml

  versionado:
    name: El dataset sigue versionado
    needs: [promote]
    # En dvc_fix se verifica el remote despues de publicar el nuevo cache.
    # Las demas ramas conservan su validacion, aunque no promuevan releases.
    if: ${{ !cancelled() && (needs.promote.result == 'success' || needs.promote.result == 'skipped') }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Proyecto2
    # `id-token: write` es lo que deja a GitHub emitir el JWT que AWS cambia
    # por credenciales temporales. Sin esta linea el paso de OIDC falla con
    # "Unable to get ACTIONS_ID_TOKEN_REQUEST_URL". Al declarar `permissions`
    # a nivel de job, lo que no se nombre queda en none: de ahi el
    # `contents: read`, que es lo minimo que necesita el checkout.
    permissions:
      contents: read
      id-token: write
    env:
      # El ARN del rol va en `vars`, no en `secrets`: no es material sensible
      # y la compuerta M2 exige cero llaves de larga vida guardadas en el
      # repo. Un fork no tiene la variable, asi que el `dvc pull` se salta en
      # vez de fallar. Referenciar el contexto directamente en un `if` no es
      # fiable, por eso se resuelve aqui.
      HAY_ROL: ${{ vars.AWS_ROLE_ARN != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -e ".[pipeline]"

      # Guarda contra el fallo silencioso que tuvimos: si alguien borra el
      # puntero, `dvc pull` deja de recuperar el dataset y nadie se entera
      # hasta que un companero clona el repo y se encuentra `data/raw` vacio.
      - name: El puntero de DVC existe y es valido
        run: |
          test -f data/raw.dvc || {
            echo "::error::Falta data/raw.dvc. El dataset dejo de estar versionado."
            exit 1
          }
          python - <<'PY'
          import sys

          import yaml

          puntero = yaml.safe_load(open("data/raw.dvc", encoding="utf-8"))
          outs = puntero.get("outs") or []
          if not outs or "md5" not in outs[0] or not outs[0].get("nfiles"):
              sys.exit("data/raw.dvc no declara un directorio con hash y nfiles")
          print(f"data/raw -> {outs[0]['md5']}  ({outs[0]['nfiles']} archivos)")
          PY

      # Federacion OIDC contra el rol que crea `terraform/modules/oidc_github`:
      # GitHub presenta un JWT, AWS devuelve credenciales temporales de ~1h.
      # No queda ninguna llave de larga vida guardada en el repositorio, y la
      # trust policy del rol solo acepta `repo:<owner>/<repo>:*`, asi que un
      # fork no puede asumirlo aunque conozca el ARN.
      - name: Autenticar contra AWS por OIDC
        if: env.HAY_ROL == 'true'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          # Misma region que `aws_region` en terraform/variables.tf.
          aws-region: us-east-1

      # Solo corre cuando el repositorio tiene configurado el rol de `prod`.
      # Sin el, el paso se salta en vez de fallar: un fork no tiene la variable.
      - name: Recuperar el dataset desde el remote
        if: env.HAY_ROL == 'true'
        run: |
          dvc pull -r prod data/raw.dvc
          dq gate
