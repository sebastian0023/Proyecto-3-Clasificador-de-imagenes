name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  quality:
    name: Ruff + pytest
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Proyecto2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependencias
        run: pip install -e ".[dev,pipeline]"

      # El build DEBE fallar si el lint o las pruebas fallan: sin `continue-on-error`.
      - name: Ruff (lint)
        run: ruff check .

      - name: Ruff (formato)
        run: ruff format --check .

      - name: pytest
        run: pytest

      # No corre `dvc repro` de verdad: necesitaria el dataset de 300+
      # imagenes y MinIO levantado, y el job `smoke` ya prueba que la
      # infraestructura arranca. Esto solo valida que `dvc.yaml` describe un
      # grafo bien formado (sin ciclos, sin una etapa que quedo sin conectar
      # por un typo en `deps`/`outs`) sin ejecutar ningun comando del pipeline.
      - name: dvc.yaml es un grafo valido
        run: dvc dag

  smoke:
    name: Arranque desde cero
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Proyecto2
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Reproduce la compuerta M1 de la rubrica: un clon limpio tiene que
      # levantar app + MariaDB + MinIO con un solo comando, sin pasos extra.
      # `up.py` falla con codigo != 0 si /health no queda en OK.
      - name: python scripts/up.py
        run: python scripts/up.py

      - name: Logs de la app si algo fallo
        if: failure()
        run: docker compose logs

      - name: Apagar
        if: always()
        run: docker compose down -v

  terraform:
    name: Terraform Validate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Proyecto2/terraform
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.0"

      # Verifica formato estricto según la guía de estilo de Terraform
      - name: Terraform Format Check
        run: terraform fmt -check

      # Inicialización sin backend remoto
      - name: Terraform Init
        run: terraform init -backend=false

      # Validación estricta de tipos y recursos
      - name: Terraform Validate
        run: terraform validate

