[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dataset-quality"
version = "0.1.0"
description = "Plataforma de calidad y versionado de datasets de deteccion de objetos (COCO)."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
    "boto3>=1.35",
    "pyyaml>=6.0",
    # pHash para el analizador de duplicados. Arrastra Pillow, numpy y
    # scipy (la DCT). Se usa la libreria en vez de implementarlo a mano.
    "imagehash>=4.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "ruff>=0.7",
    "types-pyyaml>=6.0",
]

[project.scripts]
dq = "dataset_quality.cli:run"

[tool.hatch.build.targets.wheel]
packages = ["src/dataset_quality"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
